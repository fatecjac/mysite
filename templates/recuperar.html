<!DOCTYPE html>
<html>
<head>
    <title>Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        .recuperar-container {
            max-width: 500px;
            margin-top: 10%;
        }

        .card-box {
            background: #1e293b;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-light {
            background: #334155;
            border: none;
            color: white;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            transition: background 0.2s;
        }

        .btn-light:hover {
            background: #475569;
            color: white;
        }

        h1 {
            font-weight: 700;
            font-size: 2rem;
        }

        .text-muted-custom {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="recuperar-container w-100">
        
        <div class="card-box text-center">
            <h1>Recuperação de Senha</h1>
            
            <p class="mt-4 text-muted-custom">
                Nosso site ainda não tem suporte para recuperar senha.
            </p>
            
            <p class="text-muted-custom mb-4">
                Estamos trabalhando nisso. 🚀
            </p>
            
            <a href="/login" class="btn btn-light w-100">
                Voltar para o Login
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
