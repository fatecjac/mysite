<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        .cadastro-container {
            max-width: 450px;
            margin-top: 8%;
        }

        .card-box {
            background: #1e293b;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-control {
            background: #334155;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
        }

        .form-control:focus {
            background: #475569;
            color: white;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #cbd5e1;
        }

        /* CORREÇÃO DO BOTÃO: Adicionado estilos explícitos para ele aparecer */
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            border: none !important;
            color: white !important;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #059669, #047857) !important;
            color: white !important;
        }

        h1 {
            font-weight: 700;
            font-size: 2rem;
        }

        a {
            color: #10b981;
            text-decoration: none;
        }

        a:hover {
            color: #34d399;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 11">
    <div id="liveToast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                {{ erro }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div class="container d-flex justify-content-center">
    <div class="cadastro-container w-100">
        
        <div class="card-box">
            <h1 class="text-center mb-4">Criar conta</h1>

            <form method="POST">
                <input 
                    type="text" 
                    name="nome" 
                    placeholder="Nome" 
                    class="form-control mb-3" 
                    required
                >

                <input 
                    type="email" 
                    name="email" 
                    placeholder="Email" 
                    class="form-control mb-3" 
                    required
                >

                <input 
                    type="password" 
                    name="senha" 
                    placeholder="Senha" 
                    class="form-control mb-4" 
                    required
                >

                <button type="submit" class="btn btn-success w-100">
                    Cadastrar
                </button>
            </form>

            <hr class="my-4 opacity-25">

            <div class="text-center">
                <a href="/login">Já tem uma conta? Entrar</a>
            </div>
        </div>

    </div>
</div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% if erro %}
<script>
    const toastElement = document.getElementById('liveToast');
    const toast = new bootstrap.Toast(toastElement, { delay: 5000 });
    toast.show();
</script>
{% endif %}

</body>
</html>
